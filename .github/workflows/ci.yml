name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # Modules the build no longer reaches still show up in an SBOM and in
      # every vulnerability report generated from this module, so the declared
      # dependency surface has to match the real one.
      - name: Dependencies must be tidy
        run: |
          go mod tidy -diff || {
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            exit 1
          }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # The runtime image is distroless/static, which has no dynamic loader. A
      # dependency that reaches libc through dlopen makes the binary
      # dynamically linked, and it then fails at exec time with a message that
      # says nothing about the cause. Catch it here instead.
      - name: Binary must stay statically linked
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/fastrecon ./cmd/fastrecon
          if ! file /tmp/fastrecon | grep -q "statically linked"; then
            file /tmp/fastrecon
            echo "::error::binary is not statically linked; the distroless static image cannot exec it"
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The published image is built from this repository, so a credential
      # committed here is a credential shipped. A hit fails the build.
      # The scan covers the full history, and .gitleaks.toml carries the
      # exemptions for known-fake test fixtures — one literal at a time, never
      # a path-wide hole.
      # Pinned: an unpinned scanner changes what the build enforces without a
      # commit saying so, in either direction.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-banner --redact --verbose

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reports only vulnerabilities in code paths the binary actually reaches,
      # so a hit is a finding rather than a line in an inventory. The gate
      # decides what fails the build; see the script for the rule.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -format json ./... \
            | python3 .github/scripts/vulncheck-gate.py

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test, secrets, vulnerabilities]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Pull requests build the image to prove the Dockerfile still works,
      # but never publish it.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 as well as the amd64 the serverless runtimes use: the
          # documented `docker run` is the first thing a reader tries, and it
          # fails outright on Apple Silicon without a matching manifest. The
          # builder cross-compiles, so this costs a compile, not emulation.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args carry build identity only — never a credential, which
          # would persist in the image history.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
